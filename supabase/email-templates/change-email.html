<table width="100%" cellpadding="0" cellspacing="0" style="margin:0;padding:0;background-color:#f4f5f4;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background-color:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06);">

        <!-- Header -->
        <tr>
          <td style="background-color:#1B464D;padding:32px 40px;text-align:center;">
            <img src="https://noli.ci/img/noli-vertical.png" alt="NOLI" width="140" style="display:inline-block;height:36px;width:auto;" />
          </td>
        </tr>

        <!-- Body -->
        <tr>
          <td style="padding:40px 40px 16px;">
            <h2 style="margin:0 0 8px;font-size:22px;font-weight:700;color:#171817;">
              Votre adresse email a été modifiée
            </h2>
            <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#555555;">
              L'adresse email de votre compte <strong>NOLI Assurance</strong> a été changée de <strong>{{ .OldEmail }}</strong> à <strong>{{ .Email }}</strong>.
            </p>

            <!-- Warning -->
            <table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
              <tr>
                <td style="background-color:#fef3cd;border-left:4px solid #f59e0b;padding:14px 18px;border-radius:0 6px 6px 0;">
                  <p style="margin:0;font-size:14px;line-height:1.5;color:#856404;">
                    Si vous n'avez pas effectué cette modification, contactez notre support immédiatement.
                  </p>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:24px 40px 32px;border-top:1px solid #eee;">
            <p style="margin:0;font-size:12px;color:#999999;text-align:center;">
              &copy; {{ .Year }} NOLI Assurance &mdash; Comparateur d'assurances en Côte d'Ivoire
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
